<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ロボット確認（開発用）</title>
<link rel="stylesheet" href="css/style.css">
<style>body{background:#f4efe2;padding:16px;word-break:keep-all} .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px} .cell{background:#fffaf0;border-radius:16px;padding:12px} h4{margin:0 0 8px;color:#6b2c00}</style>
</head><body><div class="wrap" id="w"></div>
<script type="module">
// 開発用：?lv=レベル で ロボット プログラミングの 画面を ならべる（こたえも れいとして 入れた じょうたい）
import { makePuzzle, mountRobot } from './js/puzzle.js';
const lv = Number(new URLSearchParams(location.search).get('lv') || 4);
const w = document.getElementById('w');
for (const L of [2, lv]) {
  const q = makePuzzle(L, 'robotplay');
  const c = document.createElement('div'); c.className = 'cell'; c.innerHTML = `<h4>レベル${L}：${q.prompt.text}</h4><div class="robot-play"></div>`; w.appendChild(c);
  const el = c.querySelector('.robot-play'); mountRobot(el, q, { onSuccess() {}, onGiveUp() {} });
  if (L === lv) { // こたえの いれかたの れい
    for (const t of q.answer.slice(4).match(/(➡️|⬅️|⬆️|⬇️)(×\d)?/g)) { const m = t.match(/^(.+?)(?:×(\d))?$/); el.querySelector(`[data-d="${m[1]}"]`).click(); if (m[2]) el.querySelector(`[data-k="${m[2]}"]`).click(); }
  }
}
document.title = 'ready';
</script></body></html>
