<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7fe8">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="へんじ">
<meta name="referrer" content="no-referrer">
<title>EndoGame へんじ</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="manifest" href="papa.webmanifest">
<style>
  :root { --bg: #f3f6fb; --card: #fff; --ink: #1f2a3d; --soft: #6b7890; --line: #e2e7f0; --blue: #2f7fe8; --red: #d6303f; --kid: #e3f6d6; --santa: #fff1e6; --papa: #e6f1ff; }
  * { box-sizing: border-box; }
  body { word-break: keep-all; overflow-wrap: anywhere; margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--blue); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; }
  header button { white-space: nowrap; flex: none; font-size: 13px; padding: 6px 8px; }
  header h1 { min-width: 0; }
  @media (max-width: 420px) { header { gap: 6px; padding-left: 12px; padding-right: 12px; } header h1 { font-size: 16px; } #syncBtn .lbl, #watchBtn .lbl, #setBtn .lbl { display: none; } }
  header button { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 10px; padding: 6px 10px; font: inherit; font-size: 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  label { display: block; font-size: 14px; color: var(--soft); margin: 8px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; background: var(--line); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.santa { background: var(--red); color: #fff; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
  .tab { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; position: relative; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab b { background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
  .segs { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; margin-bottom: 8px; }
  .seg { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 14px; min-height: 50px; padding: 6px 4px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .seg small { font-size: 11px; font-weight: 400; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .seg b { background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
  .seg.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .seg.on small { color: #cfd6e4; }
  .seg.th-papa.on { background: var(--blue); border-color: var(--blue); }
  .seg.th-mama.on { background: #e8508f; border-color: #e8508f; }
  .seg.th-santa.on { background: var(--red); border-color: var(--red); }
  .msgs { display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 85%; border-radius: 14px; padding: 8px 12px; }
  .m.kid { background: var(--kid); align-self: flex-start; }
  .m.papa { background: var(--papa); align-self: flex-end; }
  .m.santa { background: var(--santa); align-self: flex-end; }
  .m.mama { background: #ffe3ef; align-self: flex-end; }
  .m .meta { font-size: 12px; color: var(--soft); }
  .m audio { width: 240px; max-width: 100%; display: block; margin-top: 4px; }
  .m .unsent { color: var(--red); }
  .m { position: relative; }
  .m .del { position: absolute; top: 4px; right: 4px; border: 0; background: transparent; font-size: 14px; opacity: .45; cursor: pointer; padding: 2px; }
  .m .del:hover { opacity: 1; }
  .m .meta { padding-right: 22px; }
  .m.unread { outline: 2px solid #ffb21a; }
  .compose { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); }
  .compose .in { max-width: 720px; margin: 0 auto; }
  /* チャットの かたち：がめん ぜんたいは うごかさず、おてがみの わく だけ スクロール */
  html, body { height: 100%; }
  body.chat { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  body.chat header { position: static; flex: none; }
  body.chat main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; padding: 10px 16px 8px; box-sizing: border-box; }
  body.chat main > * { flex: none; }
  body.chat main > .msgbox { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin-bottom: 0; }
  body.chat .compose { position: static; flex: none; }
  body.chat main > details.card { max-height: 40vh; overflow-y: auto; }
  .compose textarea { min-height: 52px; }
  .compose .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .compose .row .btn { font-size: 14px; padding: 9px 8px; }
  .compose .row .recdot { grid-column: 1 / -1; }
  .hint { font-size: 13px; color: var(--soft); }
  .empty { color: var(--soft); text-align: center; padding: 30px 0; }
  .recdot { color: var(--red); font-weight: 700; }
  /* 📊 みまもり */
  .w-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .w-head h2 { margin: 0; font-size: 20px; }
  .w-now { font-size: 14px; border-radius: 999px; padding: 3px 10px; background: var(--line); color: var(--soft); white-space: nowrap; }
  .w-now.on { background: #dff5e1; color: #1f7a33; font-weight: 700; }
  .w-now.off { background: #ece6ff; color: #5a3fc0; font-weight: 700; }
  .w-doing { font-size: 14px; color: var(--soft); margin: 4px 0 0; }
  .w-today { font-size: 15px; margin: 10px 0 4px; }
  .w-today b { font-size: 26px; }
  .w-bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .w-bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
  .w-bar.over i { background: var(--red); }
  .w-pause { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .w-pause .btn { font-size: 14px; padding: 10px 4px; }
  .w-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .w-chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .w-chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .w-resume { width: 100%; margin-top: 10px; background: #1f9d48; color: #fff; font-size: 17px; padding: 12px; }
  .w-sec { font-size: 14px; font-weight: 700; margin: 14px 0 6px; color: var(--ink); }
  .w-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: end; height: 110px; }
  .w-day { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--soft); }
  .w-day i { width: 70%; background: #9cc4f5; border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .w-day.today i { background: var(--blue); }
  .w-day span { margin-top: 2px; }
  .w-area { display: grid; grid-template-columns: 7em 1fr 4.5em; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
  .w-area .w-bar i { background: #27a35a; }
  .w-area .w-bar.mid i { background: #f0a020; }
  .w-area .w-bar.low i { background: var(--red); }
  .w-area small { color: var(--soft); text-align: right; }
  .w-list { margin: 0; padding-left: 1.2em; font-size: 14px; }
  .w-list li { margin: 2px 0; }
  .w-tip { background: #fff8e6; border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<header><h1>✉️ へんじ</h1><button id="pairBtn">📲 つなぐ</button><button id="syncBtn">🔄<span class="lbl"> こうしん</span></button><button id="watchBtn">📊<span class="lbl"> みまもり</span></button><button id="setBtn" aria-label="せってい">⚙️<span class="lbl"> 🔔</span></button></header>
<main id="main"></main>
<div class="compose" id="compose" hidden><div class="in" id="composeIn"></div></div>
<script type="module" src="js/papa.js"></script>
</body>
</html>
