<!doctype html>
<html lang="ja">

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-user-select:none;user-select:none;touch-action:manipulation}</style>
<title>暁の砦 3D（試作）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 配置: 一画面のゲーム。上に札（波・小判・両）、残りが縦長の戦場。お城・地図・結果は戦場の上に重ねる和紙の札。 */
:root{
  color-scheme:dark;
  --ai:#15213a; --ai-deep:#0e1729; --ai-lift:#22335a;
  --washi:#ebe2cd; --washi-dim:#d6cab0; --sumi:#1c1a16; --sumi-soft:#5b5548; --shu:#bf3b2b; --kin:#d8a53f; --matsu:#3f6f58; --mute:#9eabc6;
  --brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
html,body{height:100%}
body{background:var(--ai-deep);color:var(--washi);font-family:var(--body);font-size:15px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
rt{font-size:.55em;color:inherit;opacity:.8}
#hud{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline;padding-block:8px;max-width:520px;width:100%;margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:var(--ai-lift);color:var(--washi);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.brand{font-family:var(--brush);font-size:20px;letter-spacing:.08em;margin-right:auto}
[hidden]{display:none!important}
.brand small{font-size:12px;color:var(--kin);margin-left:6px}
.st{display:flex;gap:5px;align-items:baseline;font-variant-numeric:tabular-nums;font-weight:700}
.st b{font-family:var(--brush);font-weight:400;color:var(--kin);font-size:13px}
#mute{background:none;border:1px solid var(--mute);border-radius:4px;color:var(--washi);font-size:12px;padding:2px 8px;min-height:28px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding-bottom:8px}
#cv{display:block;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;background:#6b9648}
#stage{padding-bottom:0}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
#cv{background:none}
#camui{position:absolute;right:8px;bottom:10px;display:grid;grid-template-columns:repeat(2,48px);gap:8px}
#camui button{width:48px;height:48px;border-radius:50%;background:rgba(14,23,41,.72);color:var(--washi);font-size:22px;border:1px solid rgba(235,226,205,.5);touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.card{background:var(--washi);color:var(--sumi);border-radius:8px;padding:16px;max-width:400px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.card h1{font-family:var(--brush);font-weight:400;font-size:28px;margin:0;letter-spacing:.08em;text-align:center;text-wrap:balance;line-height:1.5}
.card h2{font-family:var(--brush);font-weight:400;font-size:19px;margin:0;line-height:1.6}
.card p{margin:0}
.sub{color:var(--sumi-soft);font-size:13px}
.motto{font-family:var(--brush);color:var(--shu);text-align:center}
.fact{background:var(--washi-dim);border-radius:6px;padding:10px 12px;line-height:2}
.fact.warn{background:#f0d9c8}
.fact b{font-family:var(--brush);font-weight:400;color:var(--shu);display:block;line-height:1.4}
.btn{background:var(--shu);color:var(--washi);border-radius:6px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.big{font-size:17px;min-height:50px}
.btn.line{background:none;border:1px solid var(--sumi-soft);color:var(--sumi)}
.btn:disabled{background:var(--washi-dim);color:var(--sumi-soft);cursor:default}
.btn.sm{padding:6px 10px;min-height:40px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.heroimg{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#2a3468}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:flex;gap:10px;align-items:center;border-top:1px solid var(--washi-dim);padding-top:8px}
.up b{display:block}
.tico{width:48px;height:48px;flex:none;align-self:flex-start}
.lvl{font-variant-numeric:tabular-nums;color:var(--shu);font-weight:700;margin-left:6px}
.road{display:flex;flex-direction:column;gap:6px}
.stop{display:flex;gap:10px;align-items:center;text-align:left;background:var(--washi-dim);border-radius:6px;padding:8px 10px;min-height:52px}
.stop.done{background:none;border:1px solid var(--washi-dim)}
.stop.next{background:var(--shu);color:var(--washi)}
.stop:disabled{opacity:.45;cursor:default}
.stop .no{font-family:var(--brush);font-size:20px;width:1.6em;text-align:center;flex:none}
.stop .who{font-size:13px;opacity:.85;display:block;line-height:1.9}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.35)}
.reward{font-family:var(--brush);font-size:20px;text-align:center}
</style>
</head>
<body>
<header id="hud">
  <a class="back" href="./#games" aria-label="EndoGame に もどる">⬅ もどる</a>

  <span class="st" id="s-wave"><b>波</b><span id="h-wave">0</span></span>
  <span class="st" id="s-coin"><b>小判</b><span id="h-coin">0</span></span>
  <span class="st" id="s-sol"><b>自軍</b><span id="h-sol">0</span></span>
  <span class="st"><b>両</b><span id="h-ryo">0</span></span>

</header>
<div id="stage">
  <canvas id="gl"></canvas><canvas id="cv"></canvas>

  <div id="ov"><div class="card" id="card"></div></div>
</div>

  {n:'相馬{そうま}',lord:'相馬義胤{そうまよしたね}',col:'#3f7a4a',fact:'相馬野馬追{そうまのまおい}は、千年{せんねん}いじょう つづくと いわれる 馬{うま}の まつり。よろいを きた 人が 馬で かけぬける。'},

  {n:'安芸{あき}',lord:'毛利元就{もうりもとなり}',col:'#2f8f7f',fact:'毛利元就{もうりもとなり}は 三人{さんにん}の 子に「三本{さんぼん}の 矢{や}」の 教{おし}えを のこしたと つたわる。一本{いっぽん}は おれても、三本なら おれない。'},
  {n:'土佐{とさ}',lord:'長宗我部元親{ちょうそかべもとちか}',col:'#8f3f7a',fact:'長宗我部元親{ちょうそかべもとちか}は 土佐{とさ}から 四国{しこく}の ほとんどを したがえた。'},
  {n:'薩摩{さつま}',lord:'島津義弘{しまづよしひろ}',col:'#3a3a9a',fact:'島津義弘{しまづよしひろ}は「鬼島津{おにしまづ}」と おそれられた。関ヶ原{せきがはら}では 敵{てき}の まん中を つきぬけて 帰{かえ}った。'},

];
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,m=v=>Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f)));return'rgb('+m(r)+','+m(g)+','+m(b)+')'};
const HP0=2.1,CNT0=58;
const wavesOf=s=>3+Math.ceil(s/3),hpMul=s=>HP0+.52*(s-1)+.019*(s-1)*(s-1),cntMul=s=>1.25+.06*(s-1);

/* ---- お城でのそなえ（ずっと残る） ---- */
const SAVE='akatsuki-save-v3'+(()=>{try{const d=JSON.parse(localStorage.getItem('castleQuest.v1'));return d&&d.activeId?':'+d.activeId:''}catch(e){return''}})();
const DIFF=[.6,1,1.6],DNAME=['やさしい','ふつう','むずかしい'];

/* ---- 砦の柵と、敵の通り道 ---- */
const blocked=new Uint8Array(GW*GH),dist=new Int32Array(GW*GH),fdx=new Float32Array(GW*GH),fdy=new Float32Array(GW*GH);
let CX0=0,CX1=0,CY0=0,CY1=0,DIRS=[],CUR=null,onPath=()=>false,PADS=[],APOST=[],GPOST=[];
function segD(x,y,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));return Math.hypot(x-ax-dx*t,y-ay-dy*t)}

  [[47,-12],[50,25],[62,55],[70,100],[92,148],[118,190],[126,222]],

  for(const rd of roads)for(let i=0;i<rd.length-1;i++)if(segD(x,y,rd[i][0],rd[i][1],rd[i+1][0],rd[i+1][1])<hw)return true;return false}}
const MAPS=[
  { /* 八方の鶴ヶ城：真ん中に城、8本の道 */
    id:0,img:'map2.jpg',rect:[136,224,246,350],c:[180,305],hero:[180,390],baseHp:750,spd:1,cnt:1,bar:[180,325],ban:140,fl:[180,300,56,68],occ:[[166,229],[194,229],[203,243],[214,257],[146,257],[157,243]],

    walk(x,y){if(x>136&&x<224&&y>246&&y<350)return false;if(x>112&&x<248&&y>222&&y<374)return true;if(Math.hypot(x-180,y-305)<86)return true;

/* ================= EndoGame の 時間の きまり ================= */
// キャッスルクエストと 同じ データ（castleQuest.v1）を つかって、1日の 時間と 連続の 時間を かぞえる
(function () {
  const KEY = 'castleQuest.v1', STEP = 5;
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function tick() {
    if (document.visibilityState !== 'visible') return;
    let db; try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return; }
    if (!db || !db.profiles) return;
    const p = db.profiles.find(x => x.id === db.activeId); if (!p) return;
    const st = db.settings || {}, now = Date.now(), d = today();
    if (p.breakUntil && now < p.breakUntil) { location.href = './'; return; }
    p.play = p.play || {}; p.extra = p.extra || {};
    p.play[d] = (p.play[d] || 0) + STEP;
    const brk = (st.breakMin || 15) * 60000;
    if (!p.lastPlay || now - p.lastPlay > brk) p.contSec = 0;
    p.lastPlay = now; p.contSec = (p.contSec || 0) + STEP;
    const contLim = (st.contMin || 0) * 60;
    let leave = false;
    if (contLim && p.contSec >= contLim) { p.breakUntil = now + brk; p.contSec = 0; leave = true; }
    if (st.limitMin && p.play[d] >= (st.limitMin + (p.extra[d] || 0)) * 60) leave = true;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
    if (leave) location.href = './';
  }
  setInterval(tick, STEP * 1000);
})();
