<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ぶーぶーラリー</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1f2e">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#272d45;box-shadow:0 4px 0 #11141f;font-size:24px;text-decoration:none}</style>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  /* asphalt-night arcade: portrait race canvas centered; menus are full panels with scrolling card grids */
  --bg:#1b1f2e; --panel:#272d45; --deep:#11141f; --ink:#ffffff; --soft:#aab3cf; --yel:#ffd23f; --red:#ff4d5a; --green:#3ddc84; --blue:#4da3ff;
  --display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;box-sizing:border-box;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
section{width:100%;max-width:760px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px}
h1,h2{margin:0;font-family:var(--display);font-weight:400;color:var(--yel);text-shadow:0 3px 0 var(--deep)}
h1{font-size:clamp(38px,10vw,64px);line-height:1;text-align:center}
h2{font-size:clamp(22px,5vw,32px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;flex-wrap:wrap}
.coins{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:var(--yel);box-shadow:inset 0 0 0 3px #d9a400;display:inline-block}
button{font-family:var(--body);font-weight:800;border:0;border-radius:999px;cursor:pointer;font-size:clamp(16px,3.6vw,22px);padding:12px 26px;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--deep)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
button.go{background:var(--yel);color:#3d2a00;box-shadow:0 4px 0 #b88a00}
button.sm{font-size:15px;padding:8px 16px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sub{color:var(--soft);font-size:14px;margin:0;text-align:center}
#homeCv{width:min(60vw,240px);height:auto;aspect-ratio:1}
.seg{display:flex;gap:6px;background:var(--deep);padding:5px;border-radius:999px}
.seg button{box-shadow:none;font-size:15px;padding:8px 14px;background:transparent;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--yel);color:#3d2a00}
.grid{width:100%;flex:1;min-height:0;overflow-y:auto;display:grid;gap:10px;align-content:start;padding:2px 2px 10px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ggrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.course{border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;color:#1a1d2b;box-shadow:0 4px 0 var(--deep);font-size:15px;position:relative;overflow:hidden}
.course .road{height:30px;border-radius:8px;position:relative;overflow:hidden}
.course .road::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px);opacity:.8}
.course b{font-size:16px}
.course .num{font-family:var(--display);font-size:13px;opacity:.7}
.course .st{display:flex;gap:4px;font-size:12px}
.course .st span{padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.18);color:rgba(0,0,0,.45)}
.course .st span.on{background:#1a1d2b;color:var(--yel)}
.course.lock{filter:grayscale(1) brightness(.55);cursor:not-allowed}
.course.lock::before{content:"かぎ";position:absolute;right:10px;top:10px;font-size:12px;background:#1a1d2b;color:#fff;padding:2px 8px;border-radius:999px}
.car{background:var(--panel);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 4px 0 var(--deep);border:3px solid transparent}
.car.sel{border-color:var(--yel)}
.car canvas{width:100%;height:auto;aspect-ratio:10/11;border-radius:12px;background:#3a4157}
.car b{font-size:15px;text-align:center}
.car .ab{font-size:12px;color:var(--soft);text-align:center;min-height:2.6em;line-height:1.3}
.stars{color:var(--yel);font-size:14px;letter-spacing:1px}
.stars i{font-style:normal;color:#4a5170}
.car button{width:100%;font-size:14px;padding:8px 10px}
.car{position:relative}
.car .cimg{width:100%;aspect-ratio:10/11;object-fit:cover;border-radius:12px;background:#fff}
.car b small{display:block;font-size:11px;color:var(--soft);font-weight:500}
.car .line{font-size:12px;color:#fff3b0;text-align:center;line-height:1.35;min-height:2.7em}
.car .hornb{background:#3a4157;font-size:13px;padding:6px 10px}
#homeCv{cursor:pointer}
#homeCar b{color:var(--yel);font-size:18px}
.wrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--deep);touch-action:none}
.wrap canvas{display:block}
#pauseBtn{position:absolute;top:28px;right:8px;font-size:13px;padding:6px 12px;background:rgba(17,20,31,.6);box-shadow:none}
.ov{position:absolute;inset:0;background:rgba(17,20,31,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.res{background:var(--panel);border-radius:18px;padding:16px 20px;width:min(420px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.res .ln{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.res .ln b{font-variant-numeric:tabular-nums}
.res .tot{border-top:2px dashed #4a5170;padding-top:8px;font-size:20px;color:var(--yel)}
.big{font-family:var(--display);font-size:clamp(34px,9vw,52px);color:var(--yel);text-shadow:0 3px 0 var(--deep);margin:0}
.rival{font-weight:800;font-size:18px}
</style>
</head>
<body>


<section id="home">
  <div class="bar"><a class="homebtn" href="./#games" aria-label="EndoGame に もどる">🏠</a><div class="coins"><span class="coin"></span><span class="cv">0</span></div></div>
  <h1>ぶーぶー<br>ラリー</h1>
  <canvas id="homeCv" width="480" height="480" aria-label="いま のっている くるま"></canvas>
  <p class="sub" id="homeCar"></p>
  <div class="btns"><button class="go" id="toCourse">はしる！</button><button id="toGarage">ガレージ</button></div>
  <p class="sub" id="ctrlHint"></p>
</section>

<section id="courses" hidden>
  <div class="bar"><h2>コース</h2><div class="coins"><span class="coin"></span><span class="cv">0</span></div></div>
  <div class="seg" id="diffSeg"></div>
  <div class="grid cgrid" id="courseGrid"></div>
  <div class="btns"><button id="backC">もどる</button></div>
</section>

<section id="garage" hidden>
  <div class="bar"><h2>ガレージ</h2><div class="coins"><span class="coin"></span><span class="cv">0</span></div></div>
  <p class="sub">コインで くるまを かおう。くるまごとに とくしゅのうりょくが あるよ</p>
  <div class="grid ggrid" id="carGrid"></div>
  <div class="btns"><button id="backG">もどる</button></div>
</section>

<section id="race" hidden>
  <div class="wrap" id="wrap">
    <canvas id="cv" aria-label="レースの がめん"></canvas>
    <button id="pauseBtn" aria-label="いちじていし">ていし</button>
    <div class="ov" id="pauseOv" hidden>
      <p class="big">ていし</p>
      <div class="btns"><button class="go" id="resume">つづける</button><button id="quit">やめる</button></div>
    </div>
    <div class="ov" id="resultOv" hidden>
      <p class="big" id="resTitle">ゴール！</p>
      <p class="rival" id="resRival"></p>
      <div class="res" id="resBox"></div>
      <div class="btns"><button class="go" id="resNext">つぎの コース</button><button id="resAgain">もういちど</button><button id="resMenu">メニュー</button></div>
    </div>
  </div>
</section>

<script>
/* ================= data ================= */
const CARS=[
 {n:'ちびカー',g:1,p:0,style:'compact',col:'#ff4d5a',col2:'#ffffff',len:70,wid:42,ab:null,at:'のうりょく なし。いっしょに がんばろう'},
 {n:'タクシー',g:1,p:150,style:'taxi',col:'#ffcc1a',col2:'#222222',len:78,wid:44,ab:'magnet',at:'コインを すいよせる'},
 {n:'ミニトラック',g:1,p:200,style:'pickup',col:'#3d8bff',col2:'#ffffff',len:84,wid:46,ab:'heart',at:'ハートが 1こ ふえる'},
 {n:'パトカー',g:2,p:500,style:'police',col:'#1c1f2b',col2:'#ffffff',len:80,wid:44,ab:'clear',at:'サイレンで まえの じゃまものを どかす'},
 {n:'きゅうきゅうしゃ',g:2,p:600,style:'ambulance',col:'#f6f7fb',col2:'#ff3b4e',len:92,wid:48,ab:'heal',at:'ときどき ハートが もどる'},
 {n:'バス',g:2,p:700,style:'bus',col:'#2fbf71',col2:'#fff3a0',len:118,wid:50,ab:'tough',at:'ぶつかっても スピードが おちない'},
 {n:'しょうぼうしゃ',g:3,p:1200,style:'fire',col:'#e8322f',col2:'#d9dde3',len:108,wid:48,ab:'clear2',at:'みずで じゃまものを どんどん けす'},
 {n:'スポーツカー',g:3,p:1400,style:'sports',col:'#ff7a1a',col2:'#ffffff',len:80,wid:44,ab:'speed',at:'はやく はしれる'},
 {n:'モンスタートラック',g:3,p:1600,style:'monster',col:'#8a4dff',col2:'#ffb300',len:84,wid:50,ab:'smash',at:'ちいさい じゃまものを ふみつぶす'},
 {n:'キャンピングカー',g:4,p:2500,style:'camper',col:'#f2efe6',col2:'#2bb3a3',len:104,wid:48,ab:'item',at:'アイテムが たくさん でる'},
 {n:'レーシングカー',g:4,p:2800,style:'racer',col:'#1f6fff',col2:'#ffd400',len:84,wid:44,ab:'speed2',at:'とても はやい'},
 {n:'ロケットカー',g:4,p:3200,style:'rocket',col:'#c9d1dc',col2:'#ff4d4d',len:86,wid:44,ab:'turbo',at:'ターボで スタート。ターボが ながい'},
 {n:'きんいろリムジン',g:5,p:6000,style:'limo',col:'#f4c542',col2:'#fff3c4',len:108,wid:44,ab:'coin2',at:'コインが 2ばい'},
 {n:'にじいろカー',g:5,p:7000,style:'rainbow',col:'#ff5aa5',col2:'#ffffff',len:80,wid:44,ab:'shield',at:'ときどき バリアが でる'},
 {n:'ほしぞらカー',g:5,p:8000,style:'star',col:'#1e2a5a',col2:'#7fe3ff',len:82,wid:44,ab:'all',at:'すいよせ＋はやい＋バリア'}];
/* ================= くるまの キャラクター ================= */
// id：イラストの ファイル名（cards/rally-<id>.jpg）。nick：あだな。line：くちぐせ。horn：クラクション [おと(Hz), ながさ, かたち, まつ]
// fx：はしりかた（bounce はずむ／sway ゆれる／trail うしろに のこる もの）
const CHARA=[
 {id:'chibi',nick:'ちびまる',line:'いっしょに いこう！ ブッブー！',horn:[[880,.08,'square',0],[880,.12,'square',.12]],fx:{bounce:1.5,trail:{rate:.15,cols:['#ffffff'],s:3,spread:6}}},
 {id:'taxi',nick:'ハッピー',line:'どちらまで？ コインの ところまで！',horn:[[660,.14,'square',0],[523,.18,'square',.16]],fx:{bounce:.8,trail:{rate:.25,cols:['#ffd23f'],s:3,tw:1,spread:14}}},
 {id:'truck',nick:'ハコブン',line:'にもつは まかせて！ よいしょ！',horn:[[330,.25,'sawtooth',0]],fx:{sway:.03,bounce:1.2}},
 {id:'police',nick:'マモル',line:'あんぜん うんてんで いこう！',horn:[[700,.25,'sine',0],[950,.25,'sine',.25],[700,.25,'sine',.5]],fx:{trail:{rate:.4,cols:['#ff3030','#3a7bff'],s:3,tw:1,spread:16}}},
 {id:'ambulance',nick:'ナオスケ',line:'だいじょうぶ？ すぐ いくよ！',horn:[[960,.3,'sine',0],[770,.3,'sine',.3],[960,.3,'sine',.6]],fx:{trail:{rate:.3,cols:['#ff8fb1','#ffffff'],s:3,tw:1,spread:12}}},
 {id:'bus',nick:'ノセルン',line:'みんな のって！ しゅっぱーつ！',horn:[[220,.45,'sawtooth',0]],fx:{sway:.04}},
 {id:'fire',nick:'ジャージャー',line:'ひは ぼくに まかせて！',horn:[[1320,.06,'triangle',0],[1320,.06,'triangle',.12],[1320,.06,'triangle',.24],[1320,.06,'triangle',.36]],fx:{spray:1,trail:{rate:.35,cols:['#7fd3ff','#ffffff'],s:2.5,spread:10}}},
 {id:'sports',nick:'ビュンタ',line:'はやさなら まけないぜ！',horn:[[520,.08,'sawtooth',0],[780,.18,'sawtooth',.08]],fx:{lines:.5,trail:{rate:.3,cols:['#ffffff'],s:2,spread:8}}},
 {id:'monster',nick:'ドッスン',line:'なんでも ふみこえる！ ドッスーン！',horn:[[110,.4,'sawtooth',0],[90,.3,'sawtooth',.3]],fx:{bounce:3.5,trail:{rate:.6,cols:['#f1dfb8','#d9bd8a','#ffffff'],s:6,spread:24}}},
 {id:'camper',nick:'キャンプー',line:'たびは たのしむのが いちばん！',horn:[[523,.12,'triangle',0],[659,.12,'triangle',.13],[784,.2,'triangle',.26]],fx:{sway:.025,trail:{rate:.2,cols:['#d9dde3'],s:5,spread:6}}},
 {id:'racer',nick:'イチバン',line:'いちばんに なるぞ！',horn:[[300,.1,'sawtooth',0],[600,.25,'sawtooth',.1]],fx:{lines:.8,trail:{rate:.4,cols:['#c9ced8'],s:3,spread:10}}},
 {id:'rocket',nick:'ブースト',line:'3、2、1… はっしゃ！',horn:[[200,.5,'sawtooth',0,1400]],fx:{flame:1,lines:.6}},
 {id:'limo',nick:'キラリ',line:'ごきげんよう。コインは 2ばいで ございます',horn:[[1047,.25,'sine',0],[1319,.25,'sine',.2],[1568,.35,'sine',.4]],fx:{trail:{rate:.5,cols:['#ffe27a','#fff6c8'],s:3,tw:1,spread:12}}},
 {id:'rainbow',nick:'ニジー',line:'いろんな いろが だいすき！',horn:[[523,.1,'triangle',0],[659,.1,'triangle',.08],[784,.1,'triangle',.16],[1047,.2,'triangle',.24]],fx:{rainbow:1}},
 {id:'star',nick:'ステラ',line:'よぞらの ゆめを のせて はしるよ',horn:[[1568,.12,'sine',0],[1976,.12,'sine',.12],[2349,.25,'sine',.24]],fx:{trail:{rate:.7,cols:['#7fe3ff','#ffffff','#ffd23f'],s:3,tw:1,spread:14}}}];
// クラクション
function horn(i){const h=CHARA[i]?.horn||[[880,.1,'square',0]];h.forEach(([f,d,type,delay,f2])=>tone(f,d,type,.12,delay,f2))}
// くちぐせを よみあげる（iPad の 日本語の こえ）
function sayLine(i){try{const u=new SpeechSynthesisUtterance(CHARA[i].line.replace(/…/g,'、'));u.lang='ja-JP';u.rate=1.05;u.pitch=1.15;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const COURSES=[
 {n:'まちなか',side:'#a7d98b',road:'#5c6270',edge:'#ffffff',deco:['building','tree'],obs:['cone','barrel'],traffic:.15,rc:'#2b6cff',rs:'sports',kerb:1},
 {n:'こうえん',side:'#86d16f',road:'#6a6f7d',edge:'#ffffff',deco:['tree','flower'],obs:['cone','bush'],traffic:.1,rc:'#ff8a00',rs:'compact',kerb:1},
 {n:'うみぞい',side:'#f3df9a',road:'#656b78',edge:'#ffffff',deco:['palm'],obs:['crab','cone'],traffic:.2,rc:'#00b3a6',rs:'sports',sea:1},
 {n:'もりのみち',side:'#4f9e4f',road:'#6b5a48',edge:'#e8d9b0',deco:['pine','tree'],obs:['stump','rock'],traffic:.15,rc:'#7a4ad8',rs:'monster'},
 {n:'さばく',side:'#efcb85',road:'#8a7a66',edge:'#fff1c8',deco:['cactus','rockd'],obs:['cactus','rock','barrel'],traffic:.15,rc:'#d63b3b',rs:'monster'},
 {n:'ゆきやま',side:'#eef5ff',road:'#7c8796',edge:'#ffffff',deco:['snowpine'],obs:['snowman','rock'],traffic:.2,rc:'#1f8fff',rs:'racer'},
 {n:'かざん',side:'#5b3a33',road:'#3d3434',edge:'#ff9a3c',deco:['lava','rockd'],obs:['lavarock','barrel'],traffic:.15,rc:'#ff5a1f',rs:'rocket'},
 {n:'よるのまち',side:'#2a2d44',road:'#2c2f3a',edge:'#ffd34d',deco:['nightbld','lamp'],obs:['cone','barrel'],traffic:.3,rc:'#ff3df2',rs:'sports',night:1,kerb:1},
 {n:'うちゅう',side:'#0e1030',road:'#3b3f6b',edge:'#7fe3ff',deco:['spacestar','planet'],obs:['meteor'],traffic:.2,rc:'#9b5cff',rs:'rocket',night:1},
 {n:'にじのみち',side:'#cfe8ff',road:'#f4f6ff',edge:'rainbow',deco:['cloud'],obs:['starblock','cone'],traffic:.15,rc:'#ffcc00',rs:'racer'}];
const DIFF=[
 {n:'やさしい',base:20,sp:[30,42],two:0,hearts:5,rf:.86,rb:1,mult:1,item:[110,160],traffic:.6},
 {n:'ふつう',base:22,sp:[20,30],two:.3,hearts:3,rf:.95,rb:.7,mult:1.5,item:[140,200],traffic:1},
 {n:'むずかしい',base:25,sp:[14,22],two:.5,hearts:3,rf:1.03,rb:.4,mult:2,item:[160,230],traffic:1.4}];
const SMALL=['cone','barrel','bush','crab','starblock','stump'];
const OSIZE={cone:[26,26],barrel:[30,30],rock:[36,30],lavarock:[36,30],meteor:[38,34],bush:[36,32],stump:[30,30],cactus:[30,40],snowman:[30,40],crab:[34,26],starblock:[36,36]};
const TRAFFIC_COLS=['#e9eef5','#7a8597','#e0533f','#3d8bff','#2fbf71','#8a5a3c'];

/* ================= save ================= */
const SV={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let bank=SV.get('car-coins',0),owned=SV.get('car-owned',null),sel=SV.get('car-sel',0),clear=SV.get('car-clear',null),diff=SV.get('car-diff',0);
if(!Array.isArray(owned)||owned.length!==CARS.length)owned=CARS.map((_,i)=>i===0);
if(!Array.isArray(clear)||clear.length!==COURSES.length)clear=COURSES.map(()=>[false,false,false]);
if(!owned[sel])sel=0;
function save(){SV.set('car-coins',bank);SV.set('car-owned',owned);SV.set('car-sel',sel);SV.set('car-clear',clear);SV.set('car-diff',diff)}
const unlocked=i=>i===0||clear[i-1].some(Boolean);

/* ================= audio ================= */
let ac;
function tone(f,d=.12,type='sine',v=.14,delay=0,f2){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}
}
const arp=(fs,step=.08,type='triangle')=>fs.forEach((f,i)=>tone(f,.18,type,.12,i*step));

/* ================= draw helpers ================= */
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,k=Math.abs(p);r=Math.round(r+(f-r)*k);g=Math.round(g+(f-g)*k);b=Math.round(b+(f-b)*k);return `rgb(${r},${g},${b})`}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const OUTL='rgba(16,18,28,.7)';
function twinkle(c,x,y,s,col){c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s,y);c.quadraticCurveTo(x,y,x,y+s);c.quadraticCurveTo(x,y,x-s,y);c.quadraticCurveTo(x,y,x,y-s);c.fillStyle=col;c.fill()}
function starPath(c,x,y,r,ri=.48){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*ri:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}

  c.bezierCurveTo(-rw,y1,-hw,y1-1,-hw,y1-L*.1);c.lineTo(-hw,y0+L*.17);c.bezierCurveTo(-hw,y0+2,-fw,y0,0,y0);c.closePath()}
function trap(c,y0,w0,y1,w1){c.beginPath();c.moveTo(-w0,y0);c.lineTo(w0,y0);c.lineTo(w1,y1);c.lineTo(-w1,y1);c.closePath()}
function glass(c,y0,y1){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#5a7fb3');g.addColorStop(1,'#1f2b44');c.fillStyle=g;c.fill();c.lineWidth=1.5;c.strokeStyle=OUTL;c.stroke()}

    c.fillStyle=shade(st==='ambulance'||st==='camper'?col:col,.14);c.beginPath();c.roundRect(-hw+4,y0+L*.15,Wd-8,L*.8,6);c.fill();c.lineWidth=1.2;c.strokeStyle='rgba(0,0,0,.18)';c.stroke();
    if(st==='bus'){c.fillStyle='#22304a';for(let yy=y0+L*.2;yy<y1-10;yy+=14){c.fillRect(-hw+.5,yy,3.5,10);c.fillRect(hw-4,yy,3.5,10)}

      c.fillStyle=car.col2;c.fillRect(-hw+4,y0+L*.5,Wd-8,4)}
    if(st==='fire'){c.strokeStyle='#e3e7ee';c.lineWidth=3;c.beginPath();c.moveTo(-8,y0+L*.24);c.lineTo(-8,y1-8);c.moveTo(8,y0+L*.24);c.lineTo(8,y1-8);c.stroke();
      c.lineWidth=2;for(let yy=y0+L*.26;yy<y1-8;yy+=7){c.beginPath();c.moveTo(-8,yy);c.lineTo(8,yy);c.stroke()}
      lightbar(c,y0+L*.17,hw*.7,t,'#ff3030','#ff3030')}
    if(st==='ambulance'){c.fillStyle=car.col2;c.fillRect(-hw+1,y0+L*.15,4,L*.78);c.fillRect(hw-5,y0+L*.15,4,L*.78);
      c.fillRect(-4,y0+L*.42,8,22);c.fillRect(-11,y0+L*.42+7,22,8);lightbar(c,y0+L*.17,hw*.65,t,'#ff3030','#3a7bff')}
    if(st==='camper'){c.fillStyle=car.col2;c.fillRect(-hw+1,y0+L*.15,4,L*.78);c.fillRect(hw-5,y0+L*.15,4,L*.78);
      c.fillStyle='#24345a';c.beginPath();c.roundRect(-13,y0+L*.48,26,22,3);c.fill();c.strokeStyle='#5d7bb5';c.lineWidth=1;for(let k=1;k<4;k++){c.beginPath();c.moveTo(-13+k*6.5,y0+L*.48);c.lineTo(-13+k*6.5,y0+L*.48+22);c.stroke()}
      c.fillStyle='#cfcab8';c.beginPath();c.roundRect(-8,y0+L*.28,16,12,3);c.roundRect(-6,y1-L*.16,12,9,2);c.fill()}

      for(const s of[-1,1]){c.beginPath();c.moveTo(s*hw,y1-L*.32);c.lineTo(s*(hw+9),y1-2);c.lineTo(s*hw,y1-6);c.closePath();c.fill();c.lineWidth=1.5;c.strokeStyle=OUTL;c.stroke()}}
    c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1.2;c.beginPath();c.moveTo(-hw*.45,y0+L*.06);c.lineTo(-hw*.6,y0+L*ws[0]);c.moveTo(hw*.45,y0+L*.06);c.lineTo(hw*.6,y0+L*ws[0]);c.stroke();

    c.fillStyle='rgba(255,255,255,.38)';c.beginPath();c.moveTo(-hw*.45,y0+L*ws[0]+1);c.lineTo(-hw*.15,y0+L*ws[0]+1);c.lineTo(-hw*.35,y0+L*ws[1]-1);c.lineTo(-hw*.65,y0+L*ws[1]-1);c.fill();
    if(st==='rocket'){c.beginPath();c.ellipse(0,y0+L*((rf[0]+rf[1])/2),hw*.6,L*(rf[1]-rf[0])/2+4,0,0,7);glass(c,y0+L*rf[0],y0+L*rf[1]);c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-hw*.25,y0+L*rf[0]+6,3,7,.3,0,7);c.fill()}

      c.fillStyle='#1f2b44';c.fillRect(-hw*.86,y0+L*rf[0]+3,2.5,L*(rf[1]-rf[0])-6);c.fillRect(hw*.86-2.5,y0+L*rf[0]+3,2.5,L*(rf[1]-rf[0])-6);

      c.fillStyle='#222';for(let k=0;k<6;k++){c.fillRect(-hw+1,y0+L*.42+k*5,3,k%2?0:2.5);c.fillRect(hw-4,y0+L*.42+k*5,3,k%2?0:2.5)}}

  }

function lightbar(c,y,w,t,c1,c2){const on=Math.floor(t*6)%2;c.fillStyle='#2a2d36';c.beginPath();c.roundRect(-w,y,w*2,7,3);c.fill();

  c.save();c.globalCompositeOperation='lighter';c.fillStyle=on?'rgba(255,60,60,.35)':'rgba(70,120,255,.35)';c.beginPath();c.arc(on?-w/2:w/2,y+3,16,0,7);c.fill();c.restore()}
function drawRacer(c,car,col,L,Wd,t){

  c.fillStyle=g;c.fill();c.lineWidth=2;c.strokeStyle=OUTL;c.stroke();

function drawObs(c,o,x,y,t){
  c.save();c.lineJoin='round';c.lineCap='round';
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(x+4,y+6,o.w*.55,o.h*.42,0,0,7);c.fill();
  switch(o.type){
    case 'cone':c.fillStyle='#d9530b';c.beginPath();c.roundRect(x-13,y-13,26,26,5);c.fill();c.fillStyle='#ff8a2a';c.beginPath();c.arc(x,y,10.5,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(x,y,6.5,0,7);c.stroke();c.fillStyle='#ffc08a';c.beginPath();c.arc(x,y,2.8,0,7);c.fill();break;
    case 'barrel':{const bc=o.col||'#2f7de1';c.fillStyle=bc;c.beginPath();c.arc(x,y,15,0,7);c.fill();c.lineWidth=2;c.strokeStyle=OUTL;c.stroke();c.strokeStyle=shade(bc,-.35);c.lineWidth=2.5;c.beginPath();c.arc(x,y,10,0,7);c.stroke();c.fillStyle=shade(bc,.4);c.beginPath();c.arc(x-5,y-5,4,0,7);c.fill();c.fillStyle='#ffd23f';c.beginPath();c.arc(x,y,3,0,7);c.fill();break}
    case 'rock':case 'lavarock':case 'meteor':{const fc=o.type==='rock'?'#8f97a3':o.type==='lavarock'?'#3c2b2b':'#6d55d6';
      if(o.type==='meteor'){c.fillStyle='rgba(160,120,255,.3)';c.beginPath();c.arc(x,y,24+Math.sin(t*6)*2,0,7);c.fill()}
      c.beginPath();o.pts.forEach((r,i)=>{const a=i/o.pts.length*Math.PI*2;c.lineTo(x+Math.cos(a)*r*o.w*.5,y+Math.sin(a)*r*o.h*.5)});c.closePath();c.fillStyle=fc;c.fill();c.lineWidth=2;c.strokeStyle=OUTL;c.stroke();
      c.fillStyle=shade(fc,.3);c.beginPath();c.ellipse(x-5,y-5,8,5,-.4,0,7);c.fill();
      if(o.type==='lavarock'){c.strokeStyle='#ff8a2a';c.lineWidth=2.5;c.beginPath();c.moveTo(x-10,y+2);c.lineTo(x-2,y-2);c.lineTo(x+4,y+6);c.lineTo(x+12,y);c.stroke()}
      if(o.type==='meteor'){c.fillStyle=shade(fc,-.3);c.beginPath();c.arc(x+6,y+4,4,0,7);c.arc(x-7,y+6,3,0,7);c.fill()}break}
    case 'bush':[[-9,3,11],[8,4,11],[0,-6,12]].forEach(([a,b,r])=>{c.fillStyle='#2f8f3c';c.beginPath();c.arc(x+a,y+b,r,0,7);c.fill()});[[-9,1,7],[8,2,7],[0,-8,8]].forEach(([a,b,r])=>{c.fillStyle='#4cb85a';c.beginPath();c.arc(x+a-2,y+b-2,r,0,7);c.fill()});c.fillStyle='#ff6b8a';[[-4,-2],[6,-6],[3,6]].forEach(([a,b])=>{c.beginPath();c.arc(x+a,y+b,2.5,0,7);c.fill()});break;
    case 'stump':c.fillStyle='#7a4a24';c.beginPath();c.arc(x,y,15,0,7);c.fill();c.lineWidth=2;c.strokeStyle=OUTL;c.stroke();c.fillStyle='#e0b07a';c.beginPath();c.arc(x,y,11,0,7);c.fill();c.strokeStyle='#b88050';c.lineWidth=1.5;[7,4].forEach(r=>{c.beginPath();c.arc(x,y,r,0,7);c.stroke()});break;

const W=400,H=640,PY=500,PX=12,LX=[107,200,293],RL=60,RR=340;
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),wrap=document.getElementById('wrap');

function laneBusy(lane,d0,d1,list){return list.some(o=>o.lane===lane&&o.d>d0&&o.d<d1)}

function update(dt){
  const p=R.p,rv=R.rv,D=R.D,A=R.A;
  R.T+=dt;
  for(const q of R.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.world)q.y+=p.speed*PX*dt}R.parts=R.parts.filter(q=>q.life>0);
  for(const q of R.toasts)q.t-=dt;R.toasts=R.toasts.filter(q=>q.t>0);
  if(R.shake>0)R.shake-=dt;
  if(R.st==='count'){const before=Math.ceil(R.cd-1);R.cd-=dt;const now=Math.ceil(R.cd-1);if(now!==before&&now>=0)tone(now===0?880:440,.18,'square',.08);if(R.cd<=1){R.st='go';R.goT=.8;horn(sel);toast(CHARA[sel].nick+'「'+CHARA[sel].line+'」','#ffffff')}p.x+=(LX[p.lane]-p.x)*Math.min(1,dt*12);return}
  if(R.st==='finish'||R.st==='retire'){
    p.speed*=R.st==='retire'?.95:.985;p.d+=p.speed*dt;rv.d+=rv.speed*dt;
    if(R.st==='finish'&&Math.random()<.3)burst(rnd(60,340),rnd(80,300),['#ffd23f','#ff5d8f','#4da3ff','#3ddc84'],6,200,false);
    R.endT-=dt;if(R.endT<=0){R.st='done';showResult()}return}
  if(R.st!=='go')return;
  if(R.goT>0)R.goT-=dt;
  // speed
  let target=D.base*A.speed*(p.turbo>0?1.55:1)*(p.slow>0?.5:1);
  p.speed+=(target-p.speed)*Math.min(1,dt*(p.slow>0?6:1.6));
  p.d+=p.speed*dt;
  const tx=LX[p.lane];const vx=(tx-p.x)*Math.min(1,dt*12);p.x+=vx;p.tilt+=((vx/dt)/900*.35-p.tilt)*Math.min(1,dt*10);
  if(p.inv>0)p.inv-=dt;if(p.slow>0)p.slow-=dt;
  if(p.turbo>0){p.turbo-=dt;if(Math.random()<.6)R.parts.push({x:rnd(RL,RR),y:-10,vx:0,vy:900,life:.6,max:.6,col:'rgba(255,255,255,.6)',s:1.5,line:true})}
  if(p.shield>0)p.shield-=dt;
  carFx(dt);
  if(A.shieldEvery){p.shCD-=dt;if(p.shCD<=0){p.shCD=A.shieldEvery;p.shield=5;toast('バリア！','#7fd3ff');tone(1000,.2,'sine',.08)}}
  if(A.heal){p.healCD-=dt;if(p.healCD<=0){p.healCD=25;if(p.hearts<p.max){p.hearts++;toast('ハート かいふく！','#ff8fb1');arp([660,880])}}}
  if(A.clear){p.clearCD-=dt;if(p.clearCD<=0){const tgt=R.obs.find(o=>!o.dead&&o.lane===p.lane&&o.d-p.d>4&&o.d-p.d<32);
    if(tgt){tgt.dead=true;p.clearCD=A.clear;burst(tgt.x,sy(tgt.d),R.car.ab==='clear2'?['#7fd3ff','#ffffff','#3aa0ff']:['#ff3030','#3a7bff','#ffffff'],18,260);toast(R.car.ab==='clear2'?'みずで ジャー！':'どいて どいてー！','#7fd3ff');tone(1200,.25,'square',.06,0,700)}}}
  // rival
  let rs=D.base*(D.rf+R.ci*.004);const gap=rv.d-p.d;
  if(gap>40)rs*=1-.12*D.rb;else if(gap<-40)rs*=1+.12*D.rb;
  rv.speed+=(rs-rv.speed)*Math.min(1,dt*1.2);rv.d+=rv.speed*dt;
  const danger=R.obs.find(o=>!o.dead&&o.lane===rv.lane&&o.d-rv.d>2&&o.d-rv.d<16&&o.type!=='traffic'||(!o.dead&&o.type==='traffic'&&o.lane===rv.lane&&o.d-rv.d>0&&o.d-rv.d<12));
  if(danger){const opts=[0,1,2].filter(l=>Math.abs(l-rv.lane)===1&&!R.obs.some(o=>!o.dead&&o.lane===l&&Math.abs(o.d-rv.d-6)<12));if(opts.length)rv.lane=opts[Math.floor(Math.random()*opts.length)]}
  const rvx=(LX[rv.lane]-rv.x)*Math.min(1,dt*8);rv.x+=rvx;rv.tilt=rvx/dt/900*.35;
  if(!rv.fin&&rv.d>=R.L){rv.fin=true;toast('ライバルが ゴールした！','#ff8a8a')}
  const lead=p.d-rv.d>3?1:p.d-rv.d<-3?-1:R.lead;
  if(R.lead!==0&&lead!==R.lead&&!rv.fin){if(lead===1){toast('ぬかした！','#3ddc84');arp([784,988]);setTimeout(()=>horn(sel),250)}else{toast('ぬかされた！','#ff8a8a');tone(330,.2,'triangle',.08)}}
  R.lead=lead;
  // spawns
  const ahead=p.d+62;
  while(R.nObs<ahead&&R.nObs<R.L-25){spawnObsRow(R.nObs);R.nObs+=rnd(...D.sp)}
  while(R.nCoin<ahead&&R.nCoin<R.L-25){spawnCoins(R.nCoin);R.nCoin+=rnd(45,70)}
  while(R.nItem<ahead&&R.nItem<R.L-30){spawnItem(R.nItem);R.nItem+=rnd(...D.item)*A.item}
  while(R.nDeco<ahead)spawnDeco();
  // objects
  const half=R.car.len/2;
  for(const o of R.obs){
    if(o.type==='traffic')o.d+=o.v*dt;
    if(o.dead)continue;const oy=sy(o.d);
    if(Math.abs(oy-PY)<(o.h+R.car.len)/2*.72&&Math.abs(o.x-p.x)<(o.w+R.car.wid)/2*.72)hitObs(o,oy);
  }
  R.obs=R.obs.filter(o=>!o.dead&&sy(o.d)<H+100);
  for(const k of R.coins){
    const ky=sy(k.d);
    if(A.magnet&&Math.abs(ky-PY)<170){k.x+=(p.x-k.x)*Math.min(1,dt*7);k.d+=(p.d-k.d)*Math.min(1,dt*5)}
    if(Math.abs(ky-PY)<half+10&&Math.abs(k.x-p.x)<R.car.wid/2+12){k.got=true;R.coinsGot+=1*A.coin;tone(1320+Math.random()*120,.07,'triangle',.06);R.parts.push({x:k.x,y:ky,vx:0,vy:-80,life:.35,max:.35,col:'#ffd23f',s:7,world:false,tw:true})}
  }
  R.coins=R.coins.filter(k=>!k.got&&sy(k.d)<H+40);
  for(const it of R.items){const iy=sy(it.d);if(Math.abs(iy-PY)<half+16&&Math.abs(it.x-p.x)<R.car.wid/2+18){it.got=true;
    if(it.k==='heart'){p.hearts=Math.min(p.max,p.hearts+1);toast('ハート かいふく！','#ff8fb1');arp([660,880,1100])}
    else if(it.k==='shield'){p.shield=6;toast('バリア！','#7fd3ff');arp([523,784,1047],.06,'sine')}
    else{p.turbo=4*A.turbo;toast('ターボ！','#ffb21a');tone(200,.5,'sawtooth',.08,0,900)}
    burst(it.x,iy,['#ffffff','#ffd23f'],16,220)}}
  R.items=R.items.filter(i=>!i.got&&sy(i.d)<H+40);
  R.deco=R.deco.filter(o=>sy(o.d)<H+60);
  if(p.d>=R.L){R.st='finish';R.finished=true;R.won=!rv.fin;R.endT=2.2;toast('ゴール！','#ffd23f',true);arp([523,659,784,1047,1319],.09)}
}

function drawRoad(c){
  const R_=R,C=R_.C,p=R_.p,t=R_.T,off=(p.d*PX)%60;
  c.fillStyle=C.side;c.fillRect(0,0,W,H);
  if(C.sea){c.fillStyle='#3fa9f5';c.fillRect(0,0,RL-10,H);c.fillStyle='#f3df9a';c.fillRect(RL-12,0,12,H);c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2;
    for(let y=-40;y<H+40;y+=40){const yy=y+(p.d*PX*.5)%40;c.beginPath();c.arc(20+Math.sin(t*2+y)*4,yy,8,Math.PI*1.1,Math.PI*1.9);c.stroke()}}
  if(C.n==='うちゅう'){c.fillStyle='#ffffff';for(let i=0;i<30;i++){const yy=((i*97+p.d*PX*.3)%H);c.globalAlpha=.3+.5*((i%3)/3);c.fillRect((i*53)%W,yy,1.5,1.5)}c.globalAlpha=1}
  for(const o of R_.deco)drawDeco(c,o,o.x,sy(o.d),t,C);
  c.fillStyle='rgba(0,0,0,.18)';c.fillRect(RL-6,0,RR-RL+12,H);
  c.fillStyle=C.road;c.fillRect(RL,0,RR-RL,H);
  if(C.kerb){for(let y=-40+off;y<H+40;y+=40){c.fillStyle='#ff4d5a';c.fillRect(RL-6,y,6,20);c.fillRect(RR,y,6,20);c.fillStyle='#ffffff';c.fillRect(RL-6,y+20,6,20);c.fillRect(RR,y+20,6,20)}}
  if(C.edge==='rainbow'){['#ff5a5a','#ffb21a','#ffe14a','#3ddc84','#4da3ff','#9b5cff'].forEach((h,i)=>{c.fillStyle=h;c.fillRect(RL+i*3,0,3,H);c.fillRect(RR-3-i*3,0,3,H)})}
  else{c.fillStyle=C.edge;c.fillRect(RL+5,0,4,H);c.fillRect(RR-9,0,4,H)}
  if(C.night||C.n==='うちゅう'){c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(127,227,255,.12)';c.fillRect(RL+3,0,8,H);c.fillRect(RR-11,0,8,H);c.restore()}
  c.fillStyle=C.edge==='rainbow'?'#c9d4ff':'rgba(255,255,255,.75)';
  for(let y=-60+off;y<H+60;y+=60){c.fillRect(152,y,4,30);c.fillRect(244,y,4,30)}
  for(const [dd,label] of [[0,'スタート'],[R_.L,'ゴール']]){const yy=sy(dd);if(yy<-60||yy>H+40)continue;
    for(let i=0;i<14;i++)for(let j=0;j<2;j++){c.fillStyle=(i+j)%2?'#ffffff':'#1b1f2e';c.fillRect(RL+i*20,yy-20+j*10,20,10)}
    c.fillStyle='#ff4d5a';c.fillRect(RL-12,yy-28,10,40);c.fillRect(RR+2,yy-28,10,40);
    c.fillStyle='#ff4d5a';c.beginPath();c.roundRect(130,yy-56,140,26,8);c.fill();c.fillStyle='#fff';c.font='800 16px "M PLUS Rounded 1c",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(label,200,yy-43)}
}

  if(p.shield>0){const r=Math.max(R.car.len,R.car.wid)*.62;c.save();c.globalAlpha=p.shield<1.2&&Math.floor(t*10)%2?.3:1;c.fillStyle='rgba(127,211,255,.18)';c.beginPath();c.arc(p.x,PY,r,0,7);c.fill();c.lineWidth=3;c.strokeStyle=hsl2hex((t*200)%360,90,70);c.stroke();twinkle(c,p.x+Math.cos(t*4)*r,PY+Math.sin(t*4)*r,5,'#fff');c.restore()}
  for(const q of R.parts){if(q.line)continue;c.globalAlpha=Math.max(0,q.life/q.max);if(q.tw)twinkle(c,q.x,q.y,q.s*1.3,q.col);else{c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,q.s,0,7);c.fill()}}c.globalAlpha=1;

  c.fillStyle='#ffd23f';c.beginPath();c.roundRect(bx,13,bw*pr,6,3);c.fill();

  c.fillStyle=R.rcar.col;c.beginPath();c.arc(bx+bw*rr,16,6,0,7);c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
  c.fillStyle=R.car.style==='rainbow'?hsl2hex((t*80)%360,85,58):R.car.col;c.beginPath();c.arc(bx+bw*pr,16,7.5,0,7);c.fill();c.lineWidth=2.5;c.strokeStyle='#ffd23f';c.stroke();
  c.fillStyle='#ffd23f';c.beginPath();c.arc(22,16,7,0,7);c.fill();c.fillStyle='#fff';c.font='800 11px "M PLUS Rounded 1c",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(Math.round(pr*100)+'%',W-38,16.5);
  for(let i=0;i<p.max;i++){heartPath(c,20+i*24,36,20);c.fillStyle=i<p.hearts?'#ff5d8f':'rgba(255,255,255,.3)';c.fill();c.lineWidth=2;c.strokeStyle='rgba(17,20,31,.6)';c.stroke()}
  c.fillStyle='rgba(17,20,31,.55)';c.beginPath();c.roundRect(10,62,90,24,12);c.fill();drawCoin(c,24,74,0,0);c.fillStyle='#fff';c.font='800 15px "M PLUS Rounded 1c",sans-serif';c.textAlign='left';c.fillText(R.coinsGot,40,75);
  let iy=96;
  for(const [v,max,lab,col] of [[p.turbo,4*R.A.turbo,'ターボ','#ff8a1a'],[p.shield,6,'バリア','#3aa0ff']]){if(v>0){c.fillStyle='rgba(17,20,31,.55)';c.beginPath();c.roundRect(10,iy,90,20,10);c.fill();c.fillStyle=col;c.beginPath();c.roundRect(12,iy+2,86*Math.min(1,v/max),16,8);c.fill();c.fillStyle='#fff';c.font='800 11px "M PLUS Rounded 1c",sans-serif';c.textAlign='center';c.fillText(lab,55,iy+11);iy+=24}}
  if(touch&&R.st==='go'){c.globalAlpha=.18;c.fillStyle='#fff';[[46,-1],[W-46,1]].forEach(([x,d])=>{c.beginPath();c.arc(x,H-46,30,0,7);c.fill()});c.fillStyle='#11141f';[[46,-1],[W-46,1]].forEach(([x,d])=>{c.beginPath();c.moveTo(x+d*12,H-46);c.lineTo(x-d*8,H-60);c.lineTo(x-d*8,H-32);c.fill()});c.globalAlpha=1}
  let ty=200;
  for(const q of R.toasts){const a=Math.min(1,q.t*2.5),k=1+Math.max(0,q.t-1.2)*1.5;c.save();c.globalAlpha=a;c.translate(W/2,ty);c.scale(k,k);
    c.font=q.big?'44px "Dela Gothic One",sans-serif':'800 24px "M PLUS Rounded 1c",sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=q.big?10:7;c.strokeStyle='#11141f';c.strokeText(q.txt,0,0);c.fillStyle=q.col;c.fillText(q.txt,0,0);c.restore();ty+=q.big?56:36}
  if(R.goT>0){c.save();c.globalAlpha=Math.min(1,R.goT*2);c.font='72px "Dela Gothic One",sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=12;c.strokeStyle='#11141f';c.strokeText('GO!',W/2,250);c.fillStyle='#3ddc84';c.fillText('GO!',W/2,250);c.restore()}
  if(R.st==='count'){const n=Math.ceil(R.cd-1);const txt=n>0?String(n):'GO!';const f=1-(R.cd-1-Math.floor(R.cd-1));

    c.font='800 16px "M PLUS Rounded 1c",sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle='#11141f';const nm=(R.ci+1)+'. '+R.C.n+'（'+R.D.n+'）';c.strokeText(nm,W/2,330);c.fillStyle='#fff';c.fillText(nm,W/2,330)}
}

function startRace(ci,di){newRace(ci,di);paused=false;$('pauseOv').hidden=true;$('resultOv').hidden=true;show('race');tone(440,.1,'triangle')}
function showResult(){
  const r=R,D=r.D;const goal=r.finished?Math.round((60+r.ci*12)*D.mult):0,rb=r.finished&&r.won?Math.round(80*D.mult):0,tot=r.coinsGot+goal+rb;

/* ================= EndoGame の 時間の きまり ================= */
// キャッスルクエストと 同じ データ（castleQuest.v1）を つかって、1日の 時間と 連続の 時間を かぞえる
(function () {
  const KEY = 'castleQuest.v1', STEP = 5;
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function tick() {
    if (document.visibilityState !== 'visible') return;
    let db; try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return; }
    if (!db || !db.profiles) return;
    const p = db.profiles.find(x => x.id === db.activeId); if (!p) return;
    const st = db.settings || {}, now = Date.now(), d = today();
    if (p.breakUntil && now < p.breakUntil) { location.href = './'; return; }
    p.play = p.play || {}; p.extra = p.extra || {};
    p.play[d] = (p.play[d] || 0) + STEP;
    const brk = (st.breakMin || 15) * 60000;
    if (!p.lastPlay || now - p.lastPlay > brk) p.contSec = 0;
    p.lastPlay = now; p.contSec = (p.contSec || 0) + STEP;
    const contLim = (st.contMin || 0) * 60;
    let leave = false;
    if (contLim && p.contSec >= contLim) { p.breakUntil = now + brk; p.contSec = 0; leave = true; }
    if (st.limitMin && p.play[d] >= (st.limitMin + (p.extra[d] || 0)) * 60) leave = true;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
    if (leave) location.href = './';
  }
  setInterval(tick, STEP * 1000);
})();

/* ================= loop ================= */
let last=performance.now(),TT=0;
function frame(ts){const dt=Math.min(.033,(ts-last)/1000);last=ts;TT+=dt;
  if(screen==='race'&&R){if(!paused)update(dt);render()}
  else if(screen==='home')drawHome(TT);
  else if(screen==='garage')drawGarage(TT);
  requestAnimationFrame(frame)}
