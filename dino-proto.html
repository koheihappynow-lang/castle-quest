<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ダイナソークエスト（試作）</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic UI", sans-serif; background: #bfe6f5; }
    #view { position: fixed; inset: 0; }
    .hud { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
    .hud button { border: 0; border-radius: 22px; padding: 14px 20px; font-size: 22px; font-weight: 800; color: #4a2b10; background: linear-gradient(#ffe9a8, #f7c650); box-shadow: 0 5px 0 #c8902a, 0 8px 18px rgba(0,0,0,.18); cursor: pointer; font-family: inherit; }
    .hud button:active { transform: translateY(4px); box-shadow: 0 1px 0 #c8902a; }
    .top { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none; }
    .name { pointer-events: auto; background: rgba(255,255,255,.88); border-radius: 18px; padding: 10px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .name b { font-size: 24px; color: #2f5a24; }
    .name small { display: block; font-size: 15px; color: #6b5a3a; }
    .grow { pointer-events: auto; background: rgba(255,255,255,.88); border-radius: 18px; padding: 10px 16px; font-size: 16px; color: #4a3a20; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .grow input { width: 200px; vertical-align: middle; }
    .bar { height: 12px; border-radius: 6px; background: #e8dcc0; overflow: hidden; margin-top: 6px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8bd35a, #3fa34d); width: 50%; transition: width .6s; }
    .homebtn { pointer-events: auto; text-decoration: none; font-size: 30px; background: rgba(255,255,255,.88); border-radius: 50%; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    body.shot .hud, body.shot .top { display: none; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div class="top">
    <a class="homebtn" href="./#games" aria-label="もどる">🏠</a>
    <div class="name" style="margin-right:auto"><b>ティラノサウルス</b><small id="stage">わかもの</small><div class="bar"><i id="bar"></i></div></div>
    <label class="grow">おおきさ（しさく用）<br><input id="grow" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>
  <div class="hud">
    <button id="feed">🍖 えさ</button>
    <button id="pet">🖐 なでる</button>
    <button id="walk">🚶 さんぽ</button>
    <button id="roar">🦖 ほえる</button>
  </div>
  <script type="module" src="js/dino/proto.js"></script>
</body>
</html>
